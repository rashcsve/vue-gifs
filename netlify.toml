# GIPHY_API_KEY must be set in the Netlify site's environment variables (Functions scope).
# Functions are picked up from netlify/functions/ (gifs/gifs.ts serves /api/gifs).
[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: vue-router uses HTML5 history, so deep links need index.html.
# Functions with a `config.path` are matched before redirects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
